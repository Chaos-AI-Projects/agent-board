<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}agent-board{% endblock %}</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #172b4d; }
  header { padding: 8px 16px; background: #172b4d; color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  header a { color: #fff; }
  header form.header-search { margin: 0; display: flex; gap: 4px; }
  header form.header-search input { width: 12em; max-width: 50vw; }
  main { padding: 16px; }
  .kanban { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; }
  /* The board scrolls on both axes inside the page; column headers stay put. */
  /* stretch: a sticky header sticks only inside its own column, so every column
     must be as tall as the tallest or short ones take their headers with them. */
  .kanban { overflow: auto; max-height: calc(100vh - 140px); align-items: stretch; }
  .column { background: #ebecf0; border-radius: 6px; padding: 0 8px 8px; min-width: 220px;
            flex: 1 0 220px; }
  .column h2 { font-size: 13px; text-transform: uppercase; margin: 0 0 8px; }
  .column h2 { position: sticky; top: 0; z-index: 1; background: #ebecf0; padding: 8px 0; }
  .column.drop-ok { outline: 2px dashed #36b37e; }
  .column.drop-no { opacity: 0.4; }
  .card[data-href] { cursor: pointer; }
  .markdown { background: #fff; border-radius: 4px; padding: 4px 12px; }
  .thumb { max-width: 240px; max-height: 160px; border: 1px solid #dfe1e6; }
  .cards { min-height: 40px; display: flex; flex-direction: column; gap: 6px; }
  /* --proj-* is the project's colour (MS-652); the lease rules below still win. */
  .card { background: var(--proj-bg, #fff); border-radius: 4px; padding: 8px; box-shadow: 0 1px 1px #0002;
          border-left: 4px solid var(--proj-border, transparent); }
  .card a { color: inherit; text-decoration: none; font-weight: 600; }
  .lease { font-size: 12px; margin-top: 4px; }
  .lease-live { border-left-color: #0065ff; }
  .lease-live .lease { color: #0052cc; }
  .lease-expired { border-left-color: #ff8b00; border-left-style: dashed; background: #fffae6; }
  .lease-expired .lease { color: #974f0c; font-style: italic; }
  .lease-held { border-left-color: #6554c0; }
  .lease-held .lease { color: #403294; }
  .workflows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .workflow-card { border-left-color: var(--proj-border, #36b37e); }
  .project-key { background: var(--proj-bg); border-left: 4px solid var(--proj-border); padding: 0 4px; font-weight: 600; }
  .steps-summary { font-size: 12px; margin-top: 4px; color: #42526e; }
  .column .lane-hint { font-size: 11px; color: #5e6c84; margin: 0 0 8px; }
  .lane-hint { color: #5e6c84; font-size: 0.9em; }
  .column h3.group { font-size: 11px; text-transform: uppercase; color: #5e6c84; margin: 8px 0 4px; }
  pre.mermaid { background: #fff; border-radius: 4px; padding: 8px; overflow-x: auto; }
  .workflow-steps { padding-left: 20px; }
  .workflow-steps li { margin-bottom: 6px; }
  .this-step { font-weight: bold; }
  .labels span { font-size: 11px; background: #dfe1e6; border-radius: 3px; padding: 0 4px; }
  .error { background: #ffebe6; border: 1px solid #de350b; padding: 12px; border-radius: 4px; }
  .takeover { background: #fffae6; border: 1px solid #ff8b00; padding: 12px; border-radius: 4px; }
  form.inline { display: inline; }
  label { display: block; margin-top: 8px; }
  [hidden] { display: none !important; }
  textarea { width: 100%; min-height: 8em; }
  .events li { margin-bottom: 4px; }
  details { margin-bottom: 16px; }
  .hits { background: #fff; border-radius: 4px; padding: 8px 8px 8px 28px; }
  .hits li { margin-bottom: 4px; background: var(--proj-bg); border-left: 4px solid var(--proj-border); padding-left: 4px; }
  .hit .meta { font-size: 12px; color: #5e6c84; }
  fieldset { margin-bottom: 12px; }
  fieldset label, .filter-banner label { display: inline-block; margin: 4px 12px 4px 0; }
  .column h2 form, .hidden-lanes form { display: inline; }
  .column h2 .hide-lane { float: right; border: none; background: none; cursor: pointer; color: #5e6c84; font-size: 16px; line-height: 1; padding: 0 2px; }
  .column h2 .hide-lane:hover { color: #172b4d; }
  .hidden-lanes { margin-top: 4px; }
  .board-controls { display: flex; align-items: flex-start; gap: 16px; }
  .filter-banner { margin-left: auto; position: relative; }
  .board-controls > details[open]:not(.filter-banner) { flex: 1; }
  .view-panel { position: absolute; right: 0; top: 100%; z-index: 10; width: max-content; max-width: 90vw; background: #fff; border: 1px solid #dfe1e6; border-radius: 4px; padding: 8px 12px; box-shadow: 0 2px 6px rgba(9, 30, 66, 0.2); }
  table.projects { background: #fff; border-collapse: collapse; margin-bottom: 16px; }
  /* MS-662: a card opens its issue here, in the right half. AB-5: the board
     narrows into the left half beside it rather than sitting underneath. */
  #issue-panel { position: fixed; top: 0; right: 0; width: 50vw; height: 100vh; z-index: 20;
                 display: flex; flex-direction: column; background: #f4f5f7;
                 border-left: 1px solid #dfe1e6; }
  body.issue-panel-open header, body.issue-panel-open main { margin-right: 50vw; }
  #issue-panel .issue-panel-bar { display: flex; align-items: center; gap: 12px; justify-content: flex-end;
                                  padding: 4px 8px; background: #172b4d; color: #fff; }
  #issue-panel .issue-panel-bar a { color: #fff; }
  #issue-panel .issue-panel-close { border: none; background: none; color: #fff; cursor: pointer; font-size: 20px; line-height: 1; }
  #issue-panel iframe { flex: 1; width: 100%; border: 0; }
  @media (max-width: 800px) {
    #issue-panel { width: 100vw; }
    body.issue-panel-open header, body.issue-panel-open main { margin-right: 0; }
  }
  table.projects th, table.projects td { padding: 4px 12px; text-align: left; border-bottom: 1px solid #dfe1e6; }
</style>
</head>
<body>
{% if not embed_q %}<header><a href="/">agent-board</a><form autocomplete="off" method="get" action="/search" class="header-search"><input type="search" name="q" value="{{ header_q or "" }}" placeholder="Search issues" aria-label="Search issues"><button type="submit">Search</button></form><a href="/search">Advanced search</a><a href="/preferences">Preferences</a><a href="/projects">Projects</a><span>{{ me or "not signed in" }}</span>{% if sign_in and me %}<form method="post" action="/logout" style="margin:0"><button type="submit">Sign out</button></form>{% elif sign_in %}<a href="/login">Sign in</a>{% endif %}</header>{% endif %}
<main>{% block main %}{% endblock %}</main>
<script>
  // AB-7: a project filter's "Select all" / "Unselect all" ticks or clears
  // every box in its own group, the nearest fieldset or form, so the lanes on
  // /preferences stay as they were. Nothing is saved until Apply or Save. The
  // buttons start hidden because without this script they would do nothing.
  function checkAll(button) {
    var on = button.dataset.check === "all";
    button.closest("fieldset, form").querySelectorAll('input[type="checkbox"]')
      .forEach(function (box) { box.checked = on; });
  }
  document.querySelectorAll(".check-all").forEach(function (span) {
    span.hidden = false;
    span.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () { checkAll(b); });
    });
  });
</script>
{% if stamp %}<script>
  // AB-4: the page keeps itself current. Every few seconds it asks for the
  // stamp of what it shows and reloads when the stamp moved. It never reloads
  // over somebody's work: not while a field has focus or holds unsaved input,
  // and not while the page's own window.extraBusy() says so. A held reload is
  // tried again on the next poll, and a hidden tab does not poll at all.
  var STAMP = {{ stamp|tojson }}, STAMP_URL = {{ stamp_url|tojson }};
  var KEEP_SCROLL = "ab4-scroll:" + location.pathname + location.search;
  function fieldDirty(el) {
    var tag = String(el.tagName || "").toLowerCase(), type = String(el.type || "").toLowerCase();
    if (tag === "textarea") return el.value !== el.defaultValue;
    if (tag === "select") {
      var opts = Array.prototype.slice.call(el.options || []);
      if (type === "select-multiple") return opts.some(function (o) { return !!o.selected !== !!o.defaultSelected; });
      // A select with no `selected` option starts on its first one.
      var start = 0;
      opts.forEach(function (o, i) { if (o.defaultSelected) start = i; });
      return opts.length > 0 && el.selectedIndex !== start;
    }
    if (tag !== "input") return false;
    if (type === "checkbox" || type === "radio") return !!el.checked !== !!el.defaultChecked;
    if (type === "file") return !!(el.files && el.files.length);
    if (["hidden", "submit", "button", "reset", "image"].indexOf(type) >= 0) return false;
    return el.value !== el.defaultValue;
  }
  function pageBusy() {
    var active = document.activeElement;
    if (active && active.matches && active.matches("input, textarea, select")) return true;
    var fields = document.querySelectorAll("input, textarea, select");
    for (var i = 0; i < fields.length; i++) if (fieldDirty(fields[i])) return true;
    return !!(window.extraBusy && window.extraBusy());
  }
  async function pollStamp() {
    if (document.hidden) return;
    var got;
    try {
      var r = await fetch(STAMP_URL, {cache: "no-store", credentials: "same-origin"});
      if (!r.ok) return;
      got = (await r.json()).stamp;
    } catch (_) { return; }
    if (!got || got === STAMP || pageBusy()) return;
    // A reload keeps the window's scroll; the board's .kanban scroller is kept here.
    var kept = [].map.call(document.querySelectorAll(".kanban"), function (el) {
      return [el.scrollLeft, el.scrollTop];
    });
    try { sessionStorage.setItem(KEEP_SCROLL, JSON.stringify(kept)); } catch (_) { /* private mode */ }
    if (window.onAutoReload) window.onAutoReload();
    location.reload();
  }
  // The load an auto-reload caused. A reload happens only with every field
  // as it was served, but Firefox refills fields on reload from the old page,
  // and those values are the stale defaults; reset puts the new ones back.
  function afterAutoReload() {
    var kept = null;
    try { kept = JSON.parse(sessionStorage.getItem(KEEP_SCROLL)); sessionStorage.removeItem(KEEP_SCROLL); } catch (_) { /* none */ }
    if (!kept) return false;
    for (var f = 0; f < document.forms.length; f++) document.forms[f].reset();
    document.querySelectorAll(".kanban").forEach(function (el, i) {
      if (kept[i]) { el.scrollLeft = kept[i][0]; el.scrollTop = kept[i][1]; }
    });
    return true;
  }
  afterAutoReload();
  setInterval(pollStamp, {{ stamp_poll_ms }});
  document.addEventListener("visibilitychange", pollStamp);
</script>{% endif %}
{% if embed_q %}<script>
  // In the board's issue panel (MS-662) an issue link, the diagram's included,
  // stays in the panel; any other link (a file, the body's links) opens a new
  // tab rather than loading into the panel. A modified click is the browser's.
  // embed=1 goes in once, in the query, ahead of any #fragment.
  function embedHref(href) {
    var cut = href.indexOf("#"), frag = cut < 0 ? "" : href.slice(cut);
    var url = cut < 0 ? href : href.slice(0, cut), q = url.indexOf("?");
    if (q >= 0 && url.slice(q + 1).split("&").indexOf("embed=1") >= 0) return href;
    return url + (q < 0 ? "?" : "&") + "embed=1" + frag;
  }
  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest ? e.target.closest("a") : null;
    var href = a ? (a.getAttribute("href") || a.getAttribute("xlink:href") || "") : "";
    if (!href || href.charAt(0) === "#" || a.getAttribute("target")) return;
    e.preventDefault();
    if (href.indexOf("/issues/") === 0) {
      location.href = embedHref(href);
    } else {
      window.open(href, "_blank", "noopener");
    }
  });
</script>{% endif %}
</body>
</html>
