<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}agent-board{% endblock %}</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #172b4d; }
  header { padding: 8px 16px; background: #172b4d; color: #fff; display: flex; gap: 16px; }
  header a { color: #fff; }
  main { padding: 16px; }
  .kanban { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; }
  /* The board scrolls on both axes inside the page; column headers stay put. */
  /* stretch: a sticky header sticks only inside its own column, so every column
     must be as tall as the tallest or short ones take their headers with them. */
  .kanban { overflow: auto; max-height: calc(100vh - 140px); align-items: stretch; }
  .column { background: #ebecf0; border-radius: 6px; padding: 0 8px 8px; min-width: 220px;
            flex: 1 0 220px; }
  .column h2 { font-size: 13px; text-transform: uppercase; margin: 0 0 8px; }
  .column h2 { position: sticky; top: 0; z-index: 1; background: #ebecf0; padding: 8px 0; }
  .column.drop-ok { outline: 2px dashed #36b37e; }
  .column.drop-no { opacity: 0.4; }
  .card[data-href] { cursor: pointer; }
  .markdown { background: #fff; border-radius: 4px; padding: 4px 12px; }
  .thumb { max-width: 240px; max-height: 160px; border: 1px solid #dfe1e6; }
  .cards { min-height: 40px; display: flex; flex-direction: column; gap: 6px; }
  .card { background: #fff; border-radius: 4px; padding: 8px; box-shadow: 0 1px 1px #0002;
          border-left: 4px solid transparent; }
  .card a { color: inherit; text-decoration: none; font-weight: 600; }
  .lease { font-size: 12px; margin-top: 4px; }
  .lease-live { border-left-color: #0065ff; }
  .lease-live .lease { color: #0052cc; }
  .lease-expired { border-left-color: #ff8b00; border-left-style: dashed; background: #fffae6; }
  .lease-expired .lease { color: #974f0c; font-style: italic; }
  .lease-held { border-left-color: #6554c0; }
  .lease-held .lease { color: #403294; }
  .workflows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .workflow-card { border-left-color: #36b37e; }
  .steps-summary { font-size: 12px; margin-top: 4px; color: #42526e; }
  .column h3.group { font-size: 11px; text-transform: uppercase; color: #5e6c84; margin: 8px 0 4px; }
  pre.mermaid { background: #fff; border-radius: 4px; padding: 8px; overflow-x: auto; }
  .workflow-steps { padding-left: 20px; }
  .workflow-steps li { margin-bottom: 6px; }
  .this-step { font-weight: bold; }
  .labels span { font-size: 11px; background: #dfe1e6; border-radius: 3px; padding: 0 4px; }
  .error { background: #ffebe6; border: 1px solid #de350b; padding: 12px; border-radius: 4px; }
  .takeover { background: #fffae6; border: 1px solid #ff8b00; padding: 12px; border-radius: 4px; }
  form.inline { display: inline; }
  label { display: block; margin-top: 8px; }
  [hidden] { display: none !important; }
  textarea { width: 100%; min-height: 8em; }
  .events li { margin-bottom: 4px; }
  details { margin-bottom: 16px; }
  .hits { background: #fff; border-radius: 4px; padding: 8px 8px 8px 28px; }
  .hits li { margin-bottom: 4px; }
  .hit .meta { font-size: 12px; color: #5e6c84; }
  fieldset { margin-bottom: 12px; }
  fieldset label, .filter-banner label { display: inline-block; margin: 4px 12px 4px 0; }
  .column h2 form, .hidden-lanes form { display: inline; }
  .column h2 .hide-lane { float: right; border: none; background: none; cursor: pointer; color: #5e6c84; font-size: 16px; line-height: 1; padding: 0 2px; }
  .column h2 .hide-lane:hover { color: #172b4d; }
  .hidden-lanes { margin-top: 4px; }
  table.projects { background: #fff; border-collapse: collapse; margin-bottom: 16px; }
  table.projects th, table.projects td { padding: 4px 12px; text-align: left; border-bottom: 1px solid #dfe1e6; }
</style>
</head>
<body>
<header><a href="/">agent-board</a><a href="/search">Search</a><a href="/preferences">Preferences</a><a href="/projects">Projects</a><span>{{ me or "not signed in" }}</span>{% if sign_in and me %}<form method="post" action="/logout" style="margin:0"><button type="submit">Sign out</button></form>{% elif sign_in %}<a href="/login">Sign in</a>{% endif %}</header>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
