[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-board"
version = "0.1.0"
description = "Issue and kanban board for agents"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=3",
    # 1.x: FastMCP became MCPServer in 2.0. 1.28 added the `subject` on
    # auth tokens that MS-649's remote MCP records as the actor.
    "mcp>=1.28,<2",
    "psycopg[binary]>=3.2",
    # MS-631: verifies IAP, Cloudflare Access and Google ID-token signatures.
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
board = "board.cli:main"
board-web = "board.web:main"
board-mcp = "board.mcp_server:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["board*"]

[tool.setuptools.package-data]
board = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs prints every skip reason, so an unrun PostgreSQL leg is visible.
addopts = "-rs"
